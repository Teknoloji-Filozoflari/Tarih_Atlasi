name: Altyapı kontrolleri

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Push + pull_request aynı dalda tek grupta birleşsin (çift koşu OOM/iptal üretir).
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: node tests/run.mjs

  quality-and-web:
    runs-on: ubuntu-24.04
    # check + web:export + full production Playwright suite (Expo start is not used in CI).
    timeout-minutes: 75
    env:
      EXPO_NO_TELEMETRY: '1'
      # Force production-export preview for all Playwright webServer starts in CI.
      ATLAS_TEST_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tekrarlanabilir kurulum kapısı
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'Faz 01 BLOCKED: paket kurulumu ve package-lock.json tamamlanmalı.'
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      # Reviewed generated assets are checked as committed, never silently rebuilt in CI.
      - run: npm run check
      - run: npm run config:check
      - run: npm run web:export
      - run: npx playwright install --with-deps chromium
      - name: Web E2E (production export preview)
        # Expo `start --web` never becomes ready on GH runners (480s+ URL timeout).
        # Serve the just-built `dist/` via web:preview; keep the full Playwright suite.
        run: npm run test:web

  android-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      # Cap heap; Metro workers are separate — also force --max-workers 1 below.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Unique swap for Metro android export
        run: |
          # GH images often already have /swapfile active; fallocate there → "Text file busy".
          # Add a run-unique swap file instead of clobbering the image default.
          SWAPFILE="/mnt/atlas-swap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 6G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          swapon --show
          free -h
      # Fresh job + extra swap: same-job check/web:export previously OOM-killed Metro (exit 143).
      # No continue-on-error: this remains a hard quality gate.
      # Explicit --max-workers 1: prior CI=1 check never matched GHA's CI=true, so Metro
      # used default parallelism and was SIGKILL'd (~12m, "Killed") after Starting Metro.
      - name: Android JS/asset export
        run: npx expo export --platform android --output-dir dist-android --max-workers 1
