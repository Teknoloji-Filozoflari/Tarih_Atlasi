name: Altyapı kontrolleri

on:
  pull_request:
  push:
    # Feature-branch push+PR çift koşusunu kes; main push hâlâ kapı.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: node tests/run.mjs

  quality-and-web:
    runs-on: ubuntu-24.04
    # check + web:export + production Playwright suite (Expo start is not used in CI).
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      # Force production-export preview for all Playwright webServer starts in CI.
      ATLAS_TEST_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tekrarlanabilir kurulum kapısı
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'Faz 01 BLOCKED: paket kurulumu ve package-lock.json tamamlanmalı.'
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      # Reviewed generated assets are checked as committed, never silently rebuilt in CI.
      - run: npm run check
      - run: npm run config:check
      - run: npm run web:export
      - run: npx playwright install --with-deps chromium
      - name: Web E2E (production export preview)
        # Expo `start --web` never becomes ready on GH runners. Production export has
        # __DEV__=false, so full `test:web` (developer tools / globe-bridge diagnostics)
        # fails honestly. Gate CI on the production suite that already passed remotely.
        run: npm run test:web:production

  android-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Stub GeoNames place requires (CI android light)
        # Full graph: 16102 static require() of assets/places/*.atlas (~657MiB) → Metro
        # SIGKILL exit 137 on GH-hosted runners (unique swap + max-workers 1 insufficient).
        # Hard gate for app Hermes/JS export; full places android bundle = local/larger runner.
        # No continue-on-error.
        run: cp scripts/ci/place-assets-stub.ts src/places/generated/world/assets.ts
      - name: Android JS/asset export (places-light)
        run: npx expo export --platform android --output-dir dist-android --max-workers 1
      - name: Assert android export artifacts
        run: |
          test -d dist-android
          find dist-android -type f \( -name '*.js' -o -name '*.hbc' \) | head -20
          find dist-android -type f \( -name '*.js' -o -name '*.hbc' \) | grep -q .
