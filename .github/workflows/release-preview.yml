name: Teknik önizleme paketleri

on:
  # A reviewed release-workflow update on main starts a fresh run at that commit.
  # Ordinary product commits still use the explicit manual entry point.
  push:
    branches: [main]
    paths: ['.github/workflows/release-preview.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Önizleme sürümü (örnek: 0.1.0-preview.1)'
        required: true
        default: '0.1.0-preview.1'

permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      ATLAS_RELEASE_VERSION: ${{ inputs.version || '0.1.0-preview.1' }}
      ATLAS_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - name: Sürüm ve hedefi doğrula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json'));
          const v = process.env.ATLAS_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+-preview\.[1-9]\d*$/.test(v) || !v.startsWith(p.version + '-')) process.exit(1);
          JS
          if gh release view "v$ATLAS_RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Bu sürüm zaten var; üzerine yazılmayacak.'
            exit 1
          fi
      - run: npm ci
      - run: npm run check
        id: checks
      - run: npm run web:export
        id: web
      - run: npx playwright install --with-deps chromium
      - name: İlk açılış ve kaynak bağlantısı ön kontrolü
        id: opening
        run: npm run test:web:production -- --grep 'country name opens|Turkey opening' --max-failures=1
      - name: Gerçek web kullanıcı akışları
        id: browser
        run: npm run test:web:production
      - run: npm run release:stage && npm run release:verify
        id: stage
      - name: Docker imajını oluştur ve içeriğini doğrula
        id: docker
        run: |
          docker build --platform linux/amd64 -f docker/Dockerfile.release \
            --build-arg VERSION="$ATLAS_RELEASE_VERSION" \
            --build-arg REVISION="$ATLAS_RELEASE_REVISION" \
            -t "tarih-atlasi:$ATLAS_RELEASE_VERSION" .release/web
          docker run --rm --read-only --cap-drop ALL "tarih-atlasi:$ATLAS_RELEASE_VERSION" node scripts/verify.mjs
          docker run -d --name atlas-release --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8081:8081 "tarih-atlasi:$ATLAS_RELEASE_VERSION"
          node scripts/distribution/smoke.mjs
          docker stop atlas-release
      - name: İndirilebilir paketler ve SHA256
        id: archives
        run: |
          mkdir -p .release/out .release/docker
          tar -C .release/web -czf ".release/out/tarih-atlasi-web-$ATLAS_RELEASE_VERSION.tar.gz" .
          docker save "tarih-atlasi:$ATLAS_RELEASE_VERSION" | gzip -1 > .release/docker/tarih-atlasi-image.tar.gz
          cp .release/web/compose.yaml .release/web/README.md .release/docker/
          cp docker/Kur.sh docker/Kur.cmd .release/docker/
          tar -C .release/docker -czf ".release/out/tarih-atlasi-docker-linux-amd64-$ATLAS_RELEASE_VERSION.tar.gz" .
          cd .release/out
          sha256sum *.tar.gz > SHA256SUMS
      - name: Taslak önizleme Release oluştur
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$ATLAS_RELEASE_VERSION" .release/out/* \
            --target "$ATLAS_RELEASE_REVISION" --draft --prerelease \
            --title "Tarih Atlası $ATLAS_RELEASE_VERSION — Teknik önizleme" \
            --notes-file docs/release-notes-preview.md
      - name: Yayın sonucunu açıkla
        if: always()
        env:
          ATLAS_RELEASE_STEPS: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const steps = JSON.parse(process.env.ATLAS_RELEASE_STEPS);
          const gates = [
            ['checks', 'Kod / veri / lisans kontrolleri'],
            ['web', 'Web derlemesi'],
            ['opening', 'İlk açılış / ülke bağlantısı / şehir kaynağı'],
            ['browser', 'Gerçek tarayıcı kullanıcı akışları'],
            ['stage', 'Dağıtım içeriği ve hash kontrolü'],
            ['docker', 'Docker build / doğrulama / HTTP smoke'],
            ['archives', 'İndirilebilir arşivler ve SHA256'],
            ['release', 'Taslak teknik önizleme Release'],
          ];
          const rows = gates.map(([id, name]) => `| ${name} | ${steps[id]?.outcome ?? 'not started'} |`);
          const failed = gates.filter(([id]) => steps[id]?.outcome === 'failure').map(([, name]) => name);
          const result = steps.release?.outcome === 'success'
            ? 'Taslak teknik önizleme hazır. Taslak, depo yöneticisinin Releases ekranında görünür; henüz herkese açık değildir.'
            : `Release oluşturulmadı. Başarısız kapı: ${failed.join(', ') || 'kurulum / sürüm kontrolü; job loguna bakın'}.`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Tarih Atlası yayın sonucu\n\n${result}\n\n` +
            `Commit: ${process.env.ATLAS_RELEASE_REVISION}\n\n` +
            `| Kapı | Sonuç |\n| --- | --- |\n${rows.join('\n')}\n\n` +
            'Başarısız testler atlanarak paket yayımlanmaz. Ayrıntılar bu çalışmanın job logunda ve küçük hata tanıları artifactindedir.\n');
          JS
      - name: Test kanıtları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Küçük hata tanıları
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-failure-diagnostics
          path: |
            test-results/**/error-context.md
            test-results/**/attachments/atlas-diagnostics-*.json
          if-no-files-found: ignore
